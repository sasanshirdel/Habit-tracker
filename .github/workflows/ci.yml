name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  verify:
    name: install · format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version read from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Shared packages (packages/*) are consumed through their built dist/ (types + JS), so they
      # are built — in dependency order — before anything that imports them (P1-04). apps/worker
      # consumes the API the same way (`@habit/api/worker`, P1-03), so the API is built too. The
      # root typecheck/test scripts also run `build:deps`, so local runs behave the same.
      - name: Build shared packages and the API library
        run: pnpm build:deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Prisma schema
        working-directory: apps/api
        env:
          # Placeholder only — validation does not connect to a database.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm prisma:validate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The built web app under `next start`: locale negotiation and redirects, <html lang dir>,
      # localized content, and the CSP nonce on every script through the i18n proxy (P1-10).
      - name: Web route tests (next start)
        run: pnpm --filter @habit/web test:e2e

      # OpenAPI document generated from the routes' zod schemas (backlog P1-06, ADR-0012). The
      # export scans the built app in Nest preview mode — no database, Redis or secret — and fails
      # the job if any route is undocumented, an admin route is published, or the document is
      # invalid. The spec is kept as a build artifact for review and client generation.
      - name: Export OpenAPI document
        run: pnpm --filter @habit/api openapi:export

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: apps/api/dist/openapi.json
          if-no-files-found: error
          retention-days: 30

  # Integration tests against real PostgreSQL + Redis (backlog P1-01, P1-02). Ephemeral service
  # containers with throwaway credentials — no repository secrets. Independent of `verify`, so the
  # unit job stays fast and never needs a database or Redis.
  integration:
    name: integration · PostgreSQL + Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-alpine # keep in sync with docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: habit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d habit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Keep in sync with docker-compose.yml. Service containers cannot take a `command`, so the
        # image default applies; its maxmemory-policy is `noeviction` (what BullMQ needs), and
        # test/redis.int.test.ts asserts it.
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-not-a-secret@localhost:5432/habit_ci?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages and the API library
        run: pnpm build:deps

      - name: Apply migrations (prisma migrate deploy)
        working-directory: apps/api
        run: pnpm db:migrate:deploy

      - name: Migration status
        working-directory: apps/api
        run: pnpm db:migrate:status

      # API: PostgreSQL + Redis + queue/worker contexts in-process. Worker: builds itself and runs
      # the real worker process (enqueue → process → SIGTERM drain) — backlog P1-03.
      - name: Integration tests
        run: pnpm test:integration

      - name: No leftover integration databases or Redis keys
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          dbs="$(docker exec "$PG_CONTAINER" psql -U ci -d habit_ci -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'habit_it_%'")"
          keys="$(docker exec "$REDIS_CONTAINER" redis-cli --scan --pattern 'habit:it:*')"
          if [ -n "$dbs" ] || [ -n "$keys" ]; then
            echo "::error::Integration teardown left resources behind: dbs=[$dbs] keys=[$keys]"
            exit 1
          fi
          echo "Teardown clean: no throwaway databases or integration keys remain."

  # Browser end-to-end suite (backlog P1-13, ADR-0015): Playwright drives headless Chromium against
  # the production web build (`next start`) and the built API on PostgreSQL + Redis. Same
  # throwaway service containers as `integration`; no repository secrets.
  e2e:
    name: e2e · Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-alpine # keep in sync with docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: habit_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d habit_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.4-alpine # keep in sync with docker-compose.yml
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-not-a-secret@localhost:5432/habit_e2e?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages and the API
        run: pnpm build:deps

      # The browser reaches the API cross-origin at the suite's fixed address
      # (apps/web/e2e/browser/env.ts); NEXT_PUBLIC_API_BASE_URL is inlined at build time.
      - name: Build the web app for the suite
        run: pnpm --filter @habit/web build:e2e

      - name: Apply migrations (prisma migrate deploy)
        working-directory: apps/api
        run: pnpm db:migrate:deploy

      # Browsers are cached per Playwright version (the lockfile pins it); the OS libraries they
      # need are not cacheable and are installed on every run.
      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium (headless shell) and its OS dependencies
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium OS dependencies (browser restored from cache)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps chromium

      - name: Browser tests (Playwright)
        run: pnpm --filter @habit/web test:browser

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
